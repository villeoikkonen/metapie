{% extends "layout.html" %}

{% block title %}Metapie{% endblock %}

{% block content %}
<h2>Reseptin muokkaus</h2>
<form action="/update_recipe" method="post">
  <p>
    Reseptin nimi: <br />
    <input type="text" name="title" value="{{ recipe.title }}" maxlength="50" required/>
  </p>
  <p>
    Kuvaus: <br />
    <textarea name="description" rows="8" cols="40" maxlength="1000" required>{{ recipe.description }}</textarea>
  </p>
  <input type="hidden" name="recipe_id" value="{{ recipe.id }}" />
  <input type="submit" value="Päivitä reseptiä" />
  <input type="submit" name="back" value="Peruuta">
</form>
{% endblock %}
