{% extends "layout.html" %}

{% block title %}Metapie{% endblock %}

{% block content %}
<h2>Etsi resepti</h2>

<form action="/find_recipe" method="get">
  <p>
    <label for="query">Hakusana:</label> <input type="text" name="query" id="query" value="{{ query }}">
  </p>
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" value="Lähetä">
</form>

{% if query %}
<h2>Tulokset</h2>

<ul>
  {% for recipe in results %}
  <li><a href="/recipe/{{ recipe.id }}">{{ recipe.title }}</a></li>
  {% endfor %}
</ul>
{% endif %}
{% endblock %}
