{% extends "layout.html" %}

{% block title %}{{ recipe.title }}{% endblock %}

{% block content %}

<h2>{{ recipe.title }}</h2>
{% if session.user_id == recipe.user_id %}
<p>
  <a href="/edit_recipe/{{ recipe.id }}">Muokkaa</a>
  <a href="/remove_recipe/{{ recipe.id }}">Poista</a>
</p>
{% endif %}
<p>
  {{ recipe.description }}
</p>
<p>Raaka-aineet:</p>
<p>
  {{ recipe.ingredients }}
</p>
{% endblock %}
