{% extends "layout.html" %}

{% block title %}Käyttäjä {{ user.username }}{% endblock %}

{% block content %}

<h2>Käyttäjä {{ user.username }}</h2>
<p>
    Käyttäjällä on yhteensä {{ recipes | count }} ilmoitusta.
</p>
<h2>Reseptit</h2>
<ul>
    {% for recipe in recipes %}
    <li><a href="/recipe/{{ recipe.id }}">{{ recipe.title }}</a></li>
    {% endfor %}
</ul>

{% endblock %}
