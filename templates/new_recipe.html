{% extends "layout.html" %}

{% block title %}Uusi resepti{% endblock %}

{% block content %}
<h2>Uusi resepti</h2>
<form action="/create_recipe" method="post">
  <p>
    Reseptin nimi: <br />
    <input type="text" name="title" maxlength="50" required />
  </p>
  <p>
    Kuvaus: <br />
    <textarea name="description" rows="8" cols="40" maxlength="1000" required></textarea>
  </p>
  <p>
    Ruokavalio: <br />
    <select name="diet">
      <option value="">(valitse)</option>
      <option value="normaali">normaali</option>
      <option value="vegaaninen">vegaaninen</option>
      <option value="gluteeniton">gluteeniton</option>
      <option value="halal">halal</option>
    </select>
  </p>
  <p>
    Ruokalaji: <br />
    <select name="type">
      <option value="">(valitse)</option>
      <option value="alkuruoka">alkuruoka</option>
      <option value="pääruoka">pääruoka</option>
      <option value="jälkiruoka">jälkiruoka</option>
    </select>
  </p>
  <input type="submit" value="Luo resepti" />
</form>
{% endblock %}
